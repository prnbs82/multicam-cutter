name: ci
on: [push, pull_request]
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: install (unattended; installs ffmpeg itself via apt / brew)
        run: ./install.sh --yes --no-models
      - name: install log
        if: always()
        run: tail -n 40 install.log
      - name: lint
        run: .venv/bin/python -m pip install -q pyflakes && .venv/bin/python -m pyflakes *.py
      - name: doctor
        run: .venv/bin/python multicam.py doctor
      - name: selftest (synthetic lecture, end to end)
        run: .venv/bin/python selftest.py --make "$RUNNER_TEMP/synthetic" 8799
