name: ci
on: [push, pull_request]
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: ffmpeg
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; else brew install ffmpeg; fi
          ffmpeg -version | head -1
      - name: install
        run: ./install.sh --no-models
      - name: lint
        run: .venv/bin/python -m pip install -q pyflakes && .venv/bin/python -m pyflakes *.py
      - name: doctor
        run: .venv/bin/python multicam.py doctor
      - name: selftest (synthetic lecture, end to end)
        run: .venv/bin/python selftest.py --make "$RUNNER_TEMP/synthetic" 8799
